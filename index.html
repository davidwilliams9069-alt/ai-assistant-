<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px; background: #f9f9f9; }
    h2 { margin-bottom: 16px; font-weight: 600; }
    #chat { height: 60vh; overflow-y: auto; border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; margin-bottom: 12px; background: white; }
    .msg { margin: 8px 0; padding: 10px 14px; border-radius: 18px; max-width: 80%; line-height: 1.5; font-size: 15px; }
    .user { background: #0084ff; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
    .bot  { background: #f0f0f0; color: #111; border-bottom-left-radius: 4px; }
    #controls { display: flex; gap: 8px; }
    #input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 15px; outline: none; }
    button { padding: 10px 18px; border-radius: 24px; border: none; background: #0084ff; color: white; cursor: pointer; font-size: 14px; }
    #mic { background: #eee; color: #333; }
    #mic.listening { background: #ff3b30; color: white; }
    .thinking { color: #999; font-style: italic; font-size: 14px; }
  </style>
</head>
<body>
  <h2>🤖 My AI Assistant</h2>
  <div id="chat"></div>
  <div id="controls">
    <input id="input" placeholder="Type a message or press 🎤…" />
    <button id="mic" onclick="toggleVoice()">🎤</button>
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    let recognition, listening = false;

    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';
      const thinking = addMsg('Thinking…', 'bot thinking');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const { reply } = await res.json();
        thinking.textContent = reply;
        thinking.classList.remove('thinking');
        speak(reply);
      } catch {
        thinking.textContent = 'Error — please try again.';
      }
    }

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = `msg ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function speak(text) {
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 1.05;
      speechSynthesis.speak(utt);
    }

    function toggleVoice() {
      const mic = document.getElementById('mic');
      if (listening) { recognition?.stop(); return; }
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.onresult = e => { input.value = e.results[0][0].transcript; sendMessage(); };
      recognition.onend = () => { listening = false; mic.classList.remove('listening'); mic.textContent = '🎤'; };
      recognition.start();
      listening = true;
      mic.classList.add('listening');
      mic.textContent = '⏹ Stop';
    }
  </script>
</body>
</html>
